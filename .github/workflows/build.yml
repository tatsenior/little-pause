name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, validate version and package
        id: package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Store Windows download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LittlePause-v${{ steps.package.outputs.version }}-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged version
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download GitHub-built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LittlePause-v${{ needs.build.outputs.version }}-win-x64
          path: dist
      - name: Extract this version's changelog
        shell: python
        run: |
          import os, pathlib, re
          tag = os.environ['GITHUB_REF_NAME']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'(?ms)^## ' + re.escape(tag) + r'[^\n]*\n(.*?)(?=^## |\Z)', text)
          if not match:
              raise SystemExit('Missing changelog for ' + tag)
          notes = match.group(0).strip() + '\n\n下载并解压 LittlePause-' + tag + '-win-x64.zip 后运行小憩倒计时.exe。此下载包由 GitHub Actions 构建。\n'
          pathlib.Path('dist/release-notes.md').write_text(notes, encoding='utf-8')
      - name: Create official release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --title "小憩 · Little Pause $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md --latest
